run_backfill:
  name: Run backfill
  description: >
    Process one billing cycle backfill — daily usage/cost, hourly intervals,
    and monthly buckets — then refresh Energy external statistics.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional specific Dominion SC config entry ID.
      required: false
      selector:
        text:
    overwrite:
      name: Overwrite existing cycle
      description: Re-import selected cycle data and replace prior stored values.
      required: false
      default: false
      selector:
        boolean:

    allow_initialize_missing:
      name: Allow initialize missing cycles
      description: When true, the service may initialize the missing_cycles list when empty (used by automated runs). For manual calls, leave false to avoid implicit initialization.
      required: false
      default: false
      selector:
        boolean:

run_backfill_all:
  name: Run backfill for all incomplete cycles
  description: >
    Process all incomplete billing cycles (daily + hourly + monthly) and refresh
    Energy external statistics.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional specific Dominion SC config entry ID.
      required: false
      selector:
        text:
    overwrite:
      name: Overwrite existing cycles
      description: Re-import all incomplete cycle data and replace prior stored values.
      required: false
      default: false
      selector:
        boolean:

sync_electricity_catchup:
  name: Sync current cycle
  description: >
    Fill electricity usage/cost for the open billing cycle (daily rows and
    hourly intervals through today). Does not re-run deep historical backfill.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional specific Dominion SC config entry ID.
      required: false
      selector:
        text:

rewrite_statistics:
  name: Rewrite statistics
  description: Clear legacy dominionsc external statistics so Energy Dashboard uses recorder sensor statistics only.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional specific Dominion SC config entry ID.
      required: false
      selector:
        text:
