run_backfill_all:
  name: Run backfill for all incomplete cycles
  description: >
    Process all incomplete billing cycles (daily + hourly + monthly) and refresh
    Energy external statistics.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional specific Dominion SC config entry ID.
      required: false
      selector:
        text:
    overwrite:
      name: Overwrite existing cycles
      description: Re-import all incomplete cycle data and replace prior stored values.
      required: false
      default: false
      selector:
        boolean:

sync_electricity_catchup:
  name: Sync current cycle
  description: >
    Fill electric and gas usage/cost for the open billing cycle (daily rows and
    hourly intervals through today). Does not re-run deep historical backfill.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional specific Dominion SC config entry ID.
      required: false
      selector:
        text:

rewrite_statistics:
  name: Rewrite statistics
  description: >
    Clear legacy and current dominionsc external statistics, then force-rewrite
    hourly/daily/monthly series from stored ledgers for the Energy Dashboard.
  fields:
    config_entry_id:
      name: Config entry ID
      description: Optional specific Dominion SC config entry ID.
      required: false
      selector:
        text:
